name: Android CI Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-trainer:
    name: Build Trainer Pro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x trainer-app/gradlew

      - name: Run Unit Tests (Trainer Pro)
        run: |
          cd trainer-app
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK (Trainer Pro)
        run: |
          cd trainer-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Trainer Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: trainer-pro-debug-apk
          path: trainer-app/app/build/outputs/apk/debug/*.apk

  build-athlete:
    name: Build Athlete Pro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x athlete-app/gradlew

      - name: Run Unit Tests (Athlete Pro)
        run: |
          cd athlete-app
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK (Athlete Pro)
        run: |
          cd athlete-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Athlete Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: athlete-pro-debug-apk
          path: athlete-app/app/build/outputs/apk/debug/*.apk
